# ==========================================================
# Campus Event Management System - Spring Boot Configuration
# ==========================================================

server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campus_event_management}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f5c8d0a2b4c6e8f1a3b5c7d9e1f3a5b7c9d1e3f5a7b9c1d3e}
app.jwt.expiration-ms=604800000

# CORS Configuration
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000,http://localhost:5173}

# Logging
logging.level.com.campus.eventmanagement=DEBUG
logging.level.org.springframework.security=INFO
